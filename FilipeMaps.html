<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>FilipeMaps</title>
    <link rel="stylesheet" href="https://googleapis.com">
    <style>
        :root {
            --paper: #e4edee;
            --grid: #b9cdd1;
            --grid2: #9fb8be;
            --ink: #10303a;
            --ink2: #4b6870;
            --pin: #f2b705;
            --me: #0a7d8c;
            --surface: #f6fafa;
            --line: #c4d6d9;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --paper: #0e2229;
                --grid: #1b3943;
                --grid2: #2a5160;
                --ink: #e3f0f2;
                --ink2: #8fb0b8;
                --pin: #f2b705;
                --me: #3fd0e0;
                --surface: #143039;
                --line: #254652;
            }
        }
        :root[data-theme="dark"] {
            --paper: #0e2229;
            --grid: #1b3943;
            --grid2: #2a5160;
            --ink: #e3f0f2;
            --ink2: #8fb0b8;
            --pin: #f2b705;
            --me: #3fd0e0;
            --surface: #143039;
            --line: #254652;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            background: var(--paper);
            color: var(--ink);
            font: 400 15px/1.4 "IBM Plex Sans", system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding: 10px 14px;
            background: var(--surface);
            border-bottom: 1px solid var(--line);
        }
        h1 {
            font: 700 20px "Bricolage Grotesque", system-ui, sans-serif;
            margin: 0;
            letter-spacing: -.01em;
        }
        #status {
            font-size: 12px;
            color: var(--ink2);
            text-align: right;
        }
        #stage {
            position: relative;
            flex: 1;
            min-height: 0;
        }
        /* Contentor obrigatório para o Google Maps ocupar todo o espaço do stage */
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>FilipeMaps</h1>
        <div id="status">A carregar mapa...</div>
    </header>

    <div id="stage">
        <!-- O mapa vai ser injetado aqui -->
        <div id="map"></div>
    </div>

    <script>
        // Função global que a API da Google vai chamar assim que carregar
        function initMap() {
            const statusEl = document.getElementById('status');
            
            // Coordenadas padrão (Centro de Portugal)
            const centroPortugal = { lat: 39.5, lng: -8.0 };

            try {
                // Criação do mapa dentro da div #map
                const map = new google.maps.Map(document.getElementById('map'), {
                    center: centroPortugal,
                    zoom: 7,
                    mapId: "DEMO_MAP_ID" // Opcional: Necessário se fores usar estilos avançados na Cloud da Google
                });

                // Adiciona um marcador simples
                new google.maps.Marker({
                    position: centroPortugal,
                    map: map,
                    title: "Centro de Portugal"
                });

                statusEl.innerText = "Mapa pronto";
            } catch (error) {
                statusEl.innerText = "Erro ao carregar mapa";
                console.error(error);
            }
        }
    </script>

    <!-- Script de carregamento da API da Google. SUBSTITUI 'AQUI_A_TUA_CHAVE_API' pela tua chave real -->
    <script async defer
        src="https://googleapis.com">
    </script>

</body>
</html>
