<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FilipeMaps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{--paper:#e4edee;--grid:#b9cdd1;--grid2:#9fb8be;--ink:#10303a;--ink2:#4b6870;--pin:#f2b705;--me:#0a7d8c;--surface:#f6fafa;--line:#c4d6d9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0e2229;--grid:#1b3943;--grid2:#2a5160;--ink:#e3f0f2;--ink2:#8fb0b8;--pin:#f2b705;--me:#3fd0e0;--surface:#143039;--line:#254652}}
:root[data-theme="dark"]{--paper:#0e2229;--grid:#1b3943;--grid2:#2a5160;--ink:#e3f0f2;--ink2:#8fb0b8;--pin:#f2b705;--me:#3fd0e0;--surface:#143039;--line:#254652}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:400 15px/1.4 "IBM Plex Sans",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:baseline;justify-content:space-between;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
h1{font:700 20px "Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
#status{font-size:12px;color:var(--ink2);text-align:right}
#stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hint{position:absolute;left:12px;right:12px;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--ink2)}
.zoom{position:absolute;right:12px;top:70px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;font-size:20px;padding:0}
button,.btn{font:500 14px "IBM Plex Sans",system-ui,sans-serif;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--ink2)}
button:focus-visible,.btn:focus-within,input:focus-visible{outline:2px solid var(--me);outline-offset:2px}
button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#bar{background:var(--surface);border-top:1px solid var(--line);padding:10px 12px;display:grid;gap:8px}
.row{display:flex;gap:8px}
.row>*{flex:1}
input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
#sheet{max-height:34vh;overflow:auto;background:var(--surface);border-top:1px solid var(--line)}
.place{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.place.sel{background:var(--paper)}
.place img{width:44px;height:44px;object-fit:cover;border-radius:6px}
.dot{width:44px;height:44px;border-radius:6px;background:var(--pin);flex:none}
.place .t{flex:1;min-width:0;cursor:pointer}
.place .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place .t span{font-size:12px;color:var(--ink2)}
.place button{flex:none;padding:6px 9px;font-size:13px}
.lk{display:flex;gap:14px;margin-top:3px}.lk a{font-size:12.5px;color:var(--me);text-decoration:underline}
.empty{padding:14px;color:var(--ink2);font-size:13.5px}
#cam{position:fixed;inset:0;z-index:20;background:#000;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#cam.on{display:flex}
#cam video{flex:1;min-height:0;width:100%;object-fit:cover}
#cam .ctl{display:flex;gap:10px;padding:12px;background:#000;justify-content:center;align-items:center}
#cam .ctl button,#cam .ctl .btn{background:#1b1b1b;color:#fff;border-color:#333}
#cam .ctl .shot{background:#fff;color:#000;width:64px;height:64px;border-radius:50%;font-size:12px;padding:0}
#camMsg{color:#ddd;font-size:13px;text-align:center;padding:6px 12px;background:#000}
input[type=file]{display:none}
</style>
</head>
<body>
<header><h1>FilipeMaps</h1><div id="status">A aguardar localização…</div></header>
<div id="stage">
  <canvas id="map" aria-label="Mapa"></canvas>
  <div id="hint">Mapa sem fundo de ruas: mostra a tua posição, a grelha em metros e os locais guardados. Arrasta para mover e junta dois dedos para ampliar.</div>
  <div class="zoom"><button id="zin" aria-label="Ampliar">+</button><button id="zout" aria-label="Reduzir">−</button><button id="zme" aria-label="Centrar em mim">◎</button></div>
</div>
<div id="sheet"></div>
<div id="bar">
  <input type="text" id="name" placeholder="Nome do local (opcional)" maxlength="40" aria-label="Nome do local">
  <div class="row">
    <button id="locate">Localizar</button>
    <button id="save" class="primary">Guardar local</button>
    <button id="photo">Câmara</button>
    <button id="gmaps">Google Maps</button>
  </div>
</div>

<div id="cam" role="dialog" aria-label="Câmara">
  <video id="vid" playsinline muted autoplay></video>
  <div id="camMsg"></div>
  <div class="ctl">
    <button id="camClose">Fechar</button>
    <button id="camShot" class="shot">Foto</button>
    <button id="camFlip">Virar</button>
    <label class="btn">Ficheiro<input type="file" id="file" accept="image/*" capture="environment"></label>
  </div>
</div>

<script>
(function(){
var KEY="filipemaps:v1";
var S={origin:null,places:[],fix:null};
var view={x:0,y:0,scale:2}; // metros por pixel
var sel=null, watchId=null, stream=null, facing="environment";
var cv=document.getElementById("map"), ctx=cv.getContext("2d");
var $=function(i){return document.getElementById(i)};
var dpr=Math.min(window.devicePixelRatio||1,2), W=0,H=0;

function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);S.origin=d.origin||null;S.places=d.places||[]}}catch(e){}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({origin:S.origin,places:S.places}))}catch(e){setStatus("Memória cheia: apaga alguns locais com foto.")}}
function setStatus(t){$("status").textContent=t}

function km(a,b,c,d){var R=6371000,r=Math.PI/180,dl=(c-a)*r,dn=(d-b)*r;
 var h=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dn/2)*Math.sin(dn/2);
 return 2*R*Math.asin(Math.sqrt(h))}
function fmt(m){return m<1000?Math.round(m)+" m":(m/1000).toFixed(m<10000?2:1)+" km"}
function bearing(a,b,c,d){var r=Math.PI/180,y=Math.sin((d-b)*r)*Math.cos(c*r),x=Math.cos(a*r)*Math.sin(c*r)-Math.sin(a*r)*Math.cos(c*r)*Math.cos((d-b)*r);
 var t=(Math.atan2(y,x)/r+360)%360;return ["N","NE","E","SE","S","SO","O","NO"][Math.round(t/45)%8]}
function toM(lat,lon){var o=S.origin;return {x:(lon-o.lon)*Math.cos(o.lat*Math.PI/180)*111320,y:(lat-o.lat)*110540}}
function toPx(m){return {x:W/2+(m.x-view.x)/view.scale,y:H/2-(m.y-view.y)/view.scale}}

function resize(){var r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function niceStep(target){var p=Math.pow(10,Math.floor(Math.log10(target))),f=target/p;return (f<1.5?1:f<3.5?2:f<7.5?5:10)*p}

function draw(){
 if(!W)return;
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle=css("--paper");ctx.fillRect(0,0,W,H);
 var step=niceStep(90*view.scale), g1=css("--grid"), g2=css("--grid2");
 var x0=view.x-W/2*view.scale, x1=view.x+W/2*view.scale, y0=view.y-H/2*view.scale, y1=view.y+H/2*view.scale;
 ctx.lineWidth=1;
 for(var gx=Math.floor(x0/step)*step;gx<=x1;gx+=step){var p=toPx({x:gx,y:0}).x;ctx.strokeStyle=(Math.round(gx/step)%5===0)?g2:g1;ctx.beginPath();ctx.moveTo(Math.round(p)+.5,0);ctx.lineTo(Math.round(p)+.5,H);ctx.stroke()}
 for(var gy=Math.floor(y0/step)*step;gy<=y1;gy+=step){var q=toPx({x:0,y:gy}).y;ctx.strokeStyle=(Math.round(gy/step)%5===0)?g2:g1;ctx.beginPath();ctx.moveTo(0,Math.round(q)+.5);ctx.lineTo(W,Math.round(q)+.5);ctx.stroke()}
 // places
 S.places.forEach(function(pl){
  var m=toM(pl.lat,pl.lon),p=toPx(m);
  if(p.x<-30||p.x>W+30||p.y<-40||p.y>H+30)return;
  var on=sel===pl.id;
  ctx.fillStyle=css("--pin");ctx.strokeStyle=css("--ink");ctx.lineWidth=on?3:2;
  ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.bezierCurveTo(p.x-14,p.y-14,p.x-12,p.y-30,p.x,p.y-30);ctx.bezierCurveTo(p.x+12,p.y-30,p.x+14,p.y-14,p.x,p.y);ctx.fill();ctx.stroke();
  ctx.fillStyle=css("--ink");ctx.beginPath();ctx.arc(p.x,p.y-21,pl.img?3.5:2.5,0,7);ctx.fill();
  if(on||view.scale<6){ctx.font="500 12px 'IBM Plex Sans',system-ui,sans-serif";ctx.textAlign="left";var w=ctx.measureText(pl.name).width;
   ctx.fillStyle=css("--paper");ctx.globalAlpha=.85;ctx.fillRect(p.x+10,p.y-30,w+8,18);ctx.globalAlpha=1;ctx.fillStyle=css("--ink");ctx.fillText(pl.name,p.x+14,p.y-17)}
 });
 // me
 if(S.fix){var mm=toM(S.fix.lat,S.fix.lon),me=toPx(mm),ar=Math.max(8,(S.fix.acc||0)/view.scale);
  ctx.fillStyle=css("--me");ctx.globalAlpha=.15;ctx.beginPath();ctx.arc(me.x,me.y,ar,0,7);ctx.fill();ctx.globalAlpha=1;
  ctx.strokeStyle=css("--paper");ctx.lineWidth=3;ctx.beginPath();ctx.arc(me.x,me.y,7,0,7);ctx.fillStyle=css("--me");ctx.fill();ctx.stroke()}
 // scale bar
 var bw=step/view.scale;ctx.strokeStyle=css("--ink");ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(14,H-18);ctx.lineTo(14+bw,H-18);ctx.moveTo(14,H-24);ctx.lineTo(14,H-12);ctx.moveTo(14+bw,H-24);ctx.lineTo(14+bw,H-12);ctx.stroke();
 ctx.fillStyle=css("--ink");ctx.font="500 12px 'IBM Plex Sans',system-ui,sans-serif";ctx.textAlign="left";ctx.fillText(fmt(step),14,H-30);
 // north
 ctx.textAlign="center";ctx.font="700 13px 'Bricolage Grotesque',system-ui,sans-serif";ctx.fillText("N",W-31,H-46);
 ctx.beginPath();ctx.moveTo(W-31,H-42);ctx.lineTo(W-37,H-22);ctx.lineTo(W-31,H-27);ctx.lineTo(W-25,H-22);ctx.closePath();ctx.fill();
}

// gestures
var ptrs={},drag=null,pinch=null,moved=0;
cv.addEventListener("pointerdown",function(e){cv.setPointerCapture(e.pointerId);ptrs[e.pointerId]={x:e.clientX,y:e.clientY};moved=0;
 var ids=Object.keys(ptrs);if(ids.length===2){var a=ptrs[ids[0]],b=ptrs[ids[1]];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:view.scale}}});
cv.addEventListener("pointermove",function(e){var p=ptrs[e.pointerId];if(!p)return;var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
 var ids=Object.keys(ptrs);
 if(ids.length===2&&pinch){var a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y);view.scale=clamp(pinch.s*pinch.d/d)}
 else if(ids.length===1){view.x-=dx*view.scale;view.y+=dy*view.scale}
 draw()});
function end(e){var wasTap=moved<6&&Object.keys(ptrs).length===1;delete ptrs[e.pointerId];pinch=null;if(wasTap)tap(e)}
cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",function(e){delete ptrs[e.pointerId];pinch=null});
cv.addEventListener("wheel",function(e){e.preventDefault();view.scale=clamp(view.scale*(e.deltaY>0?1.15:1/1.15));draw()},{passive:false});
function clamp(s){return Math.min(5000,Math.max(.1,s))}
function tap(e){var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,best=null,bd=28;
 S.places.forEach(function(pl){var p=toPx(toM(pl.lat,pl.lon)),d=Math.hypot(p.x-x,p.y-18-y);if(d<bd){bd=d;best=pl.id}});
 sel=best;render();draw()}

$("zin").onclick=function(){view.scale=clamp(view.scale/1.5);draw()};
$("zout").onclick=function(){view.scale=clamp(view.scale*1.5);draw()};
$("zme").onclick=function(){centerMe()};
function centerMe(){if(!S.fix){locate();return}var m=toM(S.fix.lat,S.fix.lon);view.x=m.x;view.y=m.y;draw()}

// location
function locate(){
 if(!navigator.geolocation){setStatus("Este dispositivo não tem localização.");return}
 if(watchId!==null)return;
 setStatus("A procurar sinal…");
 try{watchId=navigator.geolocation.watchPosition(function(p){
   var first=!S.fix;
   S.fix={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};
   if(!S.origin||km(S.origin.lat,S.origin.lon,S.fix.lat,S.fix.lon)>100000){S.origin={lat:S.fix.lat,lon:S.fix.lon};persist()}
   setStatus("Localizado · precisão ±"+Math.round(S.fix.acc)+" m");
   if(first){var m=toM(S.fix.lat,S.fix.lon);view.x=m.x;view.y=m.y;view.scale=Math.min(view.scale,2)}
   draw();render()
  },function(err){watchId=null;setStatus(err.code===1?"Localização bloqueada. Permite o acesso nas definições do browser.":"Sem sinal de localização. Tenta de novo.")},{enableHighAccuracy:true,maximumAge:5000,timeout:20000})}
 catch(e){setStatus("Não foi possível pedir a localização.")}
}
$("locate").onclick=function(){if(watchId===null)locate();else centerMe()};

function here(){ if(S.fix)return{lat:S.fix.lat,lon:S.fix.lon,gps:true};
 var o=S.origin||{lat:0,lon:0};return{lat:o.lat+view.y/110540,lon:o.lon+view.x/(111320*Math.cos(o.lat*Math.PI/180)),gps:false}}
function addPlace(name,img){
 if(!S.origin){setStatus("Primeiro toca em Localizar para definir a tua posição.");return null}
 var h=here(),id="p"+Date.now();
 S.places.unshift({id:id,name:name,lat:h.lat,lon:h.lon,t:Date.now(),img:img||null,gps:h.gps});
 sel=id;persist();render();draw();
 setStatus(h.gps?"Guardado na tua posição.":"Guardado no centro do mapa (sem GPS).");return id}
$("save").onclick=function(){var n=$("name").value.trim()||("Local "+(S.places.length+1));if(addPlace(n,null))$("name").value=""};

$("gmaps").onclick=function(){
 if(!S.fix&&!S.origin){setStatus("Toca em Localizar primeiro para abrir a tua posição no Google Maps.");return}
 var h=here();window.open("https://www.google.com/maps/search/?api=1&query="+h.lat+","+h.lon,"_blank","noopener")};

// list
function render(){
 var el=$("sheet");el.innerHTML="";
 if(!S.places.length){var e=document.createElement("div");e.className="empty";e.textContent="Ainda não guardaste nenhum local. Toca em Guardar local para marcar onde estás, ou tira uma foto com a Câmara.";el.appendChild(e);return}
 S.places.forEach(function(pl){
  var row=document.createElement("div");row.className="place"+(sel===pl.id?" sel":"");
  var th;if(pl.img){th=document.createElement("img");th.src=pl.img;th.alt=pl.name}else{th=document.createElement("div");th.className="dot"}
  var t=document.createElement("div");t.className="t";
  var d=S.fix?fmt(km(S.fix.lat,S.fix.lon,pl.lat,pl.lon))+" para "+bearing(S.fix.lat,S.fix.lon,pl.lat,pl.lon):pl.lat.toFixed(5)+", "+pl.lon.toFixed(5);
  var b=document.createElement("b");b.textContent=pl.name;var s=document.createElement("span");s.textContent=d;t.appendChild(b);t.appendChild(s);
  var lk=document.createElement("div");lk.className="lk";
  [["Abrir no Google Maps","https://www.google.com/maps/search/?api=1&query="],["Direções","https://www.google.com/maps/dir/?api=1&destination="]].forEach(function(l){var a=document.createElement("a");a.textContent=l[0];a.href=l[1]+pl.lat+","+pl.lon;a.target="_blank";a.rel="noopener noreferrer";a.onclick=function(ev){ev.stopPropagation()};lk.appendChild(a)});
  t.appendChild(lk);
  t.onclick=function(){sel=pl.id;var m=toM(pl.lat,pl.lon);view.x=m.x;view.y=m.y;render();draw()};
  var x=document.createElement("button");x.textContent="Apagar";x.setAttribute("aria-label","Apagar "+pl.name);
  x.onclick=function(){S.places=S.places.filter(function(q){return q.id!==pl.id});if(sel===pl.id)sel=null;persist();render();draw()};
  row.appendChild(th);row.appendChild(t);row.appendChild(x);el.appendChild(row)})
}

// camera
function camMsg(t){$("camMsg").textContent=t||""}
function openCam(){$("cam").classList.add("on");startStream()}
function stopStream(){if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}}
function startStream(){
 stopStream();camMsg("");
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){camMsg("Câmara indisponível aqui. Usa Ficheiro para escolher ou tirar uma foto.");return}
 navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false}).then(function(s){stream=s;$("vid").srcObject=s}).catch(function(){camMsg("Sem acesso à câmara. Usa Ficheiro para escolher ou tirar uma foto.")})}
function closeCam(){stopStream();$("cam").classList.remove("on")}
function fromSource(src,w,h){
 var sc=Math.min(1,360/Math.max(w,h)),c=document.createElement("canvas");c.width=Math.round(w*sc);c.height=Math.round(h*sc);
 c.getContext("2d").drawImage(src,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.6)}
function stamp(){var d=new Date();return "Foto "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
$("photo").onclick=openCam;
$("camClose").onclick=closeCam;
$("camFlip").onclick=function(){facing=facing==="environment"?"user":"environment";startStream()};
$("camShot").onclick=function(){var v=$("vid");if(!stream||!v.videoWidth){camMsg("A câmara ainda não está pronta.");return}
 var img=fromSource(v,v.videoWidth,v.videoHeight);if(addPlace($("name").value.trim()||stamp(),img)){$("name").value="";closeCam()}};
$("file").onchange=function(e){var f=e.target.files[0];if(!f)return;var im=new Image(),u=URL.createObjectURL(f);
 im.onload=function(){var d=fromSource(im,im.naturalWidth,im.naturalHeight);URL.revokeObjectURL(u);if(addPlace($("name").value.trim()||stamp(),d)){$("name").value="";closeCam()}};
 im.onerror=function(){camMsg("Não consegui ler essa imagem.")};im.src=u;e.target.value=""};

window.addEventListener("resize",resize);
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeCam()});
load();
if(S.origin){var o=S.origin;view.x=0;view.y=0}
render();resize();
if(S.places.length){var m0=S.origin?toM(S.places[0].lat,S.places[0].lon):{x:0,y:0};view.x=m0.x;view.y=m0.y;draw()}
setTimeout(function(){$("hint").style.display="none"},12000);
$("hint").onclick=function(){this.style.display="none"};
})();
</script>
</body>
</html>
